name: Prototype checks
on:
  push:
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q backend
      - name: Demo presence
        run: test -s web-demo/index.html && grep -qi 'QIPIQ' web-demo/index.html
      - name: Secrets safety reminder
        run: test ! -f backend/.env
