name: Prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q backend
      - name: Voice gateway tests
        run: |
          python -m pip install -r backend/requirements.txt
          python -m unittest discover -s tests -p test_realtime_voice.py
      - name: Demo presence
        run: test -s web-demo/index.html && grep -qi 'QIPIQ' web-demo/index.html
      - name: Secrets safety reminder
        run: test ! -f backend/.env
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    defaults:
      run:
        shell: bash
        working-directory: firmware/qipiq_v2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        run: |
          source /opt/esp/idf/export.sh
          idf.py build
          idf.py merge-bin -o qipiq-mini-v2-flash.bin -f raw
      - uses: actions/upload-artifact@v4
        with:
          name: qipiq-mini-v2-firmware
          path: |
            firmware/qipiq_v2/build/qipiq-mini-v2-flash.bin
            firmware/qipiq_v2/build/bootloader/bootloader.bin
            firmware/qipiq_v2/build/partition_table/partition-table.bin
            firmware/qipiq_v2/build/qipiq_mini_v2.bin
            firmware/qipiq_v2/build/flash_args
          if-no-files-found: error
